# ---------------------------------------------------------------------------
# Security pipeline — UDG Security Scanner (GitLab CI/CD Component).
#
# Integrated per pipeline-templates/security/docs/integrate-security-scanner.prompt.md.
# Component version is PINNED to the exact tag @v4.0.1 (current latest, verified via
# ls-remote 2026-07-16) — the prompt-doc's bare-major "@4" does NOT resolve on this
# GitLab and fails with "Component content not found" (0-job red pipeline). Bump the
# tag deliberately when the template releases a new version.
#
# Scanners: Grype (CVE), Checkov (IaC/misconfig), Gitleaks (secrets),
# OSV (deps), Socket (supply-chain).
# Gate policy: BLOCK the pipeline on CVE (Grype) and secret (Gitleaks) findings;
# Checkov / OSV / Socket run report-only. Adjust via the *-gate-enabled inputs.
#
# Prerequisites (outside this file):
#   * GitLab 16.0+ (CI/CD Components support).
#   * This project must be granted access to pipeline-templates/security
#     (grant by Marcello Pabst) — the include will not resolve, and the pipeline
#     will fail with "Component content not found", until that access exists.
# ---------------------------------------------------------------------------

stages:
  - security_scanning
  - mint
  - baseline

include:
  - component: $CI_SERVER_FQDN/pipeline-templates/security/security-scanner@v4.0.1
    inputs:
      grype-gate-enabled: true
      grype-fail-on: critical      # NOTE: dead in v4.0.1 (component bug — see override below)
      gitleaks-gate-enabled: true

# Workaround for a v4.0.1 component bug: the component's .grypeFs job hardcodes a
# JOB-LEVEL variable `GRYPE_FAIL_ON: "high"`, which shadows the `grype-fail-on`
# input (job-level vars beat the include's global var). Re-set it at the job level
# here — a main-file job definition merges over the included one — so the gate
# blocks only on CRITICAL, not high. Remove once the component honors the input.
grype-fs-scan:
  variables:
    GRYPE_FAIL_ON: "critical"

# --- SBOM generation (DEFERRED) --------------------------------------------
# Syft SBOM + upload to Dependency-Track. Left OUT for now because it requires
# CI/CD variables DTRACK_API_URL + DTRACK_API_KEY (BOM_UPLOAD permission), which
# are NOT currently present at project or group scope. The sbom-generation job
# POSTs unconditionally and has NO allow_failure, so without those vars it
# hard-fails (exit 1) and reds the pipeline on every push.
#
# To re-enable once the DTRACK vars are provisioned (project Settings -> CI/CD ->
# Variables, or inherited from group/instance):
#   1) add   - sbom_generation   to the stages: list above
#   2) append this item to the include: block above:
#        - component: $CI_SERVER_FQDN/pipeline-templates/security/sbom-generation@v4.0.1
# ---------------------------------------------------------------------------

# --- Token minting (self-serve; the private key NEVER touches git) ---------
# Mint an AgentOS RS256 JWT without anyone handling the raw private key. The key lives ONLY as a
# PROTECTED, File-type CI/CD variable `AGNO_PRIVATE_KEY` — set it at the `msq-turbo` GROUP level so
# it is shared across the squad and survives project transfers. It is NEVER committed.
#
# Mint (GitLab UI):  Build > Pipelines > "Run pipeline" on `main`, add variables:
#     MINT_USER=<handle>            (required)
#     MINT_DAYS=30                  (optional, default 30)
#     MINT_SCOPES="agents:run workflows:run ..."   (optional; default = full scope set)
#   -> open the `mint-token` job -> download the `agno_mcp_token` artifact (expires in 1 day).
#
# Protected CI variables are only exposed on PROTECTED refs, so this runs on `main` only, and only
# for a web-triggered pipeline that sets MINT_USER (never on ordinary pushes/MRs).
# Full setup / rotation / revocation runbook: docs/AUTH_KEYS.md.
mint-token:
  stage: mint
  needs: []          # DAG: start immediately, don't wait for security_scanning (utility job, not gated by it)
  image: python:3.12-slim
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && $MINT_USER && $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH'
  variables:
    MINT_DAYS: "30"
  script:
    - |
      if [ -z "${AGNO_PRIVATE_KEY:-}" ]; then
        echo "ERROR: AGNO_PRIVATE_KEY (protected File CI/CD variable) is not set/exposed."
        echo "  fix: add it at the msq-turbo group (Settings > CI/CD > Variables; Type=File, Protected,"
        echo "       Masked-if-possible) AND run this pipeline on a PROTECTED branch (main). See docs/AUTH_KEYS.md."
        exit 1
      fi
    - pip install --quiet --no-input pyjwt cryptography
    - python3 scripts/mint_token.py --user "$MINT_USER" --days "$MINT_DAYS" ${MINT_SCOPES:+--scopes $MINT_SCOPES} --key "$AGNO_PRIVATE_KEY" > agno_mcp_token
    - echo "Minted RS256 JWT for user=$MINT_USER days=$MINT_DAYS. Download the 'agno_mcp_token' artifact (expires in 1 day); never commit it. Wire into Claude Code per scripts/README.md."
  artifacts:
    paths: [agno_mcp_token]
    expire_in: 1 day   # enough to grab it same-day; the token itself is short-lived (--days). Dial down for tighter exposure.

# --- Baseline CEM build (Cycle 2, decision 1b) -----------------------------
# The Custom Elements Manifest is NOT committed to helix-code (State 3 per the CEM-availability probe
# 2026-07-29) — the FE team added `analyze:flat` specifically for external CI consumers. This job
# clones helix-code (READ-ONLY), builds the CEM with pnpm, and publishes `custom-elements.json` as an
# artifact for the helix-baseline-reader workflow to consume (delivery to the container via
# HELIX_CODE_CEM_PATH — see docs/AUTH_KEYS.md / cycle-2 deliverable; NO pnpm in the Agno runtime image).
#
# OPT-IN: runs ONLY when the pipeline is started with BUILD_CEM set (Run pipeline / schedule / trigger),
# so it never reds ordinary push/MR pipelines while helix-code CI access is still being provisioned.
# [U] REQUIRES CI variables on msq-turbo/helix-agents (group scope): BASELINE_REPO_TOKEN (+ optional
#     BASELINE_REPO_USERNAME) — the SAME helix-code deploy token the reader uses. HELIX_CODE_REPO_URL
#     defaults to the known clean URL below (not a secret). Fails loud if the token is absent.
build-cem:
  stage: baseline
  needs: []          # DAG: start immediately, don't wait for security_scanning (produces its own artifact)
  image: node:22-bookworm-slim
  rules:
    - if: '$BUILD_CEM'
  variables:
    HELIX_CODE_REPO_URL: "https://rmvc01.rm.udg.de/msq-turbo/helix-code.git"
    HELIX_CODE_REF: "master"
    CEM_REL_PATH: "packages/elements/custom-elements.json"   # helix-code layout (probe 2026-07-29)
    CEM_PACKAGE_NAME: "cem"           # generic package registry: stable name/version -> stable download URL
    CEM_PACKAGE_VERSION: "latest"     # re-published (overwritten) each run; download URL never changes
  # single |-block literal so YAML never tokenizes shell ':'/'{'/'[' inside the commands
  script:
    - |
      set -e
      if [ -z "${BASELINE_REPO_TOKEN:-}" ]; then
        echo "ERROR - BASELINE_REPO_TOKEN (helix-code deploy token) not set as a CI/CD variable."
        echo "  fix - add BASELINE_REPO_TOKEN (+ optional BASELINE_REPO_USERNAME) at the msq-turbo group."
        exit 1
      fi
      apt-get update -qq && apt-get install -y -qq git >/dev/null
      # credential helper reads the token from env -> token stays out of argv and out of .git/config
      git config --global credential.helper '!f() { echo "username=${BASELINE_REPO_USERNAME:-token}"; echo "password=${BASELINE_REPO_TOKEN}"; }; f'
      git clone --depth 1 --branch "$HELIX_CODE_REF" "$HELIX_CODE_REPO_URL" helix-code
      cd helix-code && corepack enable && pnpm install --frozen-lockfile
      pnpm --filter @helix/elements run analyze:flat
      test -f "$CEM_REL_PATH" || { echo "ERROR - CEM not produced at $CEM_REL_PATH after analyze:flat"; exit 1; }
      cp "$CEM_REL_PATH" "$CI_PROJECT_DIR/custom-elements.json"
      echo "CEM built - $(wc -c < "$CI_PROJECT_DIR/custom-elements.json") bytes"
      # Publish to the generic package registry at a STABLE url (retires the pinned-job-URL re-pin toil).
      # Upload auth = CI_JOB_TOKEN (no extra scope/token needed for THIS project's generic packages).
      # Download side (container fetch_cem.py) uses a read_api token, unchanged. Fail LOUD (SP-6): a
      # non-2xx aborts the job so a stale package is never silently kept.
      PKG_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${CEM_PACKAGE_NAME}/${CEM_PACKAGE_VERSION}/custom-elements.json"
      echo "Publishing CEM -> $PKG_URL"
      code=$(curl -sS -o /tmp/cem_publish.out -w '%{http_code}' --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "$CI_PROJECT_DIR/custom-elements.json" "$PKG_URL")
      case "$code" in
        200|201) echo "CEM published OK (http $code): $(cat /tmp/cem_publish.out)";;
        *) echo "ERROR - CEM publish to package registry failed (http $code): $(cat /tmp/cem_publish.out)"; exit 1;;
      esac
  artifacts:
    paths: [custom-elements.json]
    expire_in: 1 week
